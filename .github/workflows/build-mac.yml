name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build macOS (arm64 + x64)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install librsvg
        run: brew install librsvg

      - name: Generate macOS icon from SVG
        run: |
          mkdir -p assets/icons/mac
          if [ -f assets/icons/mac/icon.icns ]; then
            echo "icon.icns already present - skipping generation"
            exit 0
          fi
          ICONSET=assets/icons/mac/icon.iconset
          mkdir -p "$ICONSET"
          for size in 16 32 64 128 256 512 1024; do
            rsvg-convert -w $size -h $size assets/icons/logo.svg -o "$ICONSET/icon_${size}x${size}.png"
          done
          cp "$ICONSET/icon_32x32.png" "$ICONSET/icon_16x16@2x.png"
          cp "$ICONSET/icon_64x64.png" "$ICONSET/icon_32x32@2x.png"
          cp "$ICONSET/icon_256x256.png" "$ICONSET/icon_128x128@2x.png"
          cp "$ICONSET/icon_512x512.png" "$ICONSET/icon_256x256@2x.png"
          cp "$ICONSET/icon_1024x1024.png" "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o assets/icons/mac/icon.icns
          ls -la assets/icons/mac/

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Create empty .env for extraResources
        # package.json declares `.env` as an extraResource. CI has no .env, so we
        # write an empty one to keep electron-builder from complaining at pack time.
        run: |
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Compile renderer + electron sources
        # vite-plugin-electron already bundles electron/main.ts + electron/preload.ts
        # into dist-electron/ alongside the renderer in dist/. We skip the separate
        # `tsc -p tsconfig.electron.json` step (which is type-checking only and
        # currently has unrelated pre-existing TS errors that don't affect the
        # runtime bundle that electron-builder packages).
        run: |
          npx rimraf dist dist-electron
          npx vite build

      - name: Detect signing secrets
        id: secrets
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -n "$MAC_CERT_P12" ] && [ -n "$APPLE_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets detected - signed + notarized build."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets - unsigned build."
          fi

      - name: Decide publish flag
        id: publish
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "flag=always" >> "$GITHUB_OUTPUT"
          else
            echo "flag=never" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (unsigned, both archs)
        if: steps.secrets.outputs.signed == 'false'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --no-install electron-builder build --mac --arm64 --x64 \
            --publish=${{ steps.publish.outputs.flag }} \
            --config.mac.identity=null \
            --config.mac.notarize=false \
            --config.mac.hardenedRuntime=false \
            --config.mac.gatekeeperAssess=false

      - name: Build (signed + notarized, both archs)
        if: steps.secrets.outputs.signed == 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --no-install electron-builder build --mac --arm64 --x64 \
            --publish=${{ steps.publish.outputs.flag }}

      - name: List release artifacts
        run: ls -la release/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sylica-AI-mac
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac*.yml
          if-no-files-found: warn
          retention-days: 14
